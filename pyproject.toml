[build-system]
requires = [
    "scikit-build-core>=1.0",
    "pybind11>=3.0",
]
build-backend = "scikit_build_core.build"

[project]
name = "lumen-engine"
version = "0.1.0"
description = "A low-level C++ image-processing library for Python"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
]

[tool.scikit-build]
wheel.packages = ["python/lumen"]

[tool.scikit-build.cmake.define]
LUMEN_BUILD_PYTHON = "ON"
BUILD_TESTING = "OFF"